# The .NET API (OpenTelemetry on api:9464, and blackbox on /health/ready). The bell's own system alerts (backups, n8n
# failures, the AI) stay in the panel; these are what the bell cannot see: the API itself, and the bell's own rounds.
groups:
  - name: api
    rules:
      - alert: ApiDown
        expr: probe_success{job="probe", service="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Hazem''s API is down'
          description: 'WhatsApp messages get no reply, and the panel shows no data. n8n keeps the messages and retries every minute (T-20).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#apidown

      - alert: ApiHighErrorRate
        expr: |
          sum by (service) (rate(http_server_request_duration_seconds_count{job="api", http_response_status_code=~"5.."}[10m]))
            / sum by (service) (rate(http_server_request_duration_seconds_count{job="api"}[10m])) > 0.05
          and sum by (service) (increase(http_server_request_duration_seconds_count{job="api"}[10m])) > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Over 5% of the API''s requests fail (5xx)'
          description: 'The rate is {{ $value | humanizePercentage }} over the last 10 minutes. Check the api logs in Grafana.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#apihigherrorrate

      # The panel's pages (not Hazem's turns, which wait for the AI, nor the bell's live stream, which stays open minutes).
      - alert: ApiSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_server_request_duration_seconds_bucket{job="api", http_route=~"/api/panel/.+", http_route!="/api/panel/alerts/stream"}[10m]))) > 3
          and sum by (service) (rate(http_server_request_duration_seconds_count{job="api", http_route=~"/api/panel/.+", http_route!="/api/panel/alerts/stream"}[10m])) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'The panel is slow (95% of requests over 3 seconds)'
          description: 'The p95 is {{ $value | humanizeDuration }}. See the slowest routes on the API dashboard.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#apislowrequests

      - alert: HazemTurnsSlow
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_server_request_duration_seconds_bucket{job="api", http_route="/api/hazem/turns"}[15m]))) > 45
          and sum by (service) (increase(http_server_request_duration_seconds_count{job="api", http_route="/api/hazem/turns"}[15m])) > 3
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Hazem takes over 45 seconds to reply'
          description: 'The p95 is {{ $value | humanizeDuration }}. Usually the AI is slow (see "Calls out" on the API dashboard).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#hazemturnsslow

      - alert: ApiDbPoolNearFull
        expr: |
          sum by (service, db_client_connection_pool_name) (db_client_connection_count{job="api", db_client_connection_state="used"})
            / max by (service, db_client_connection_pool_name) (db_client_connection_max{job="api"}) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'The API''s database connections are running out (Npgsql pool)'
          description: 'Using {{ $value | humanizePercentage }} of the pool. New requests wait for a free connection.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#apidbpoolnearfull

      - alert: ApiThreadPoolQueue
        expr: max by (service) (dotnet_thread_pool_queue_length_total{job="api"}) > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Work is queued in the API''s thread pool'
          description: '{{ $value | printf "%.0f" }} items waiting. Something is blocking threads (a request waiting without async).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#apithreadpoolqueue

      # The bell's own worker (AlertMetrics): it makes the alerts every 3 seconds and mails them. When it stops, the bell and
      # its e-mails stop with it, and only the monitoring can say so.
      - alert: AlertWorkerStalled
        expr: |
          max by (service) (time() - office_alerts_last_ok_round_timestamp_seconds{job="api"}) > 180
          or
          max by (service) (rate(office_alerts_rounds_total{job="api", result="failed"}[5m])) > 0
            unless max by (service) (rate(office_alerts_rounds_total{job="api", result="ok"}[5m])) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'The bell''s alerts have stopped'
          description: 'The bell and its e-mails (urgent, overdue, system problems) are not being made now. Check the api logs.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#alertworkerstalled

      # (the counter starts at its first failure: the "unless … offset" half is that first one)
      - alert: AlertEmailsFailing
        expr: |
          max by (service) (increase(office_alerts_emails_total{job="api", result="failed"}[30m])) > 0
          or (max by (service) (office_alerts_emails_total{job="api", result="failed"})
              unless max by (service) (office_alerts_emails_total{job="api", result="failed"} offset 30m))
        labels: { severity: warning }
        annotations:
          summary: 'The panel''s e-mails are not being sent'
          description: '{{ $value | printf "%.0f" }} alert e-mail(s) failed in half an hour. The same mail (Resend) sends the sign-in codes, so they may be failing too.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#alertemailsfailing
