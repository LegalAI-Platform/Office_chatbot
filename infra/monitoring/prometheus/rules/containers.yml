# The containers (Telegraf, from Docker's own API). A service with an HTTP check says more (apps.yml, api.yml, databases.yml);
# these catch the rest: a container that stopped, that Docker's own healthcheck calls unhealthy, or that keeps restarting.
groups:
  - name: containers
    rules:
      # v1.109: only the services the office runs on (the default profile, the edge and the Named Tunnel). A profile's container
      # stopped on purpose never pages: the old Quick Tunnel (tunnel), WAHA, the test stub. Neither does a one-shot job that
      # finished (preflight, storage-init, …) or a `docker compose run`. The monitoring's own are TargetDown's.
      - alert: ContainerExited
        expr: |
          max by (service) (docker_container_status_exitcode{container_status=~"exited|dead", oneoff!="True",
            service=~"postgres|redis|garage|n8n|api|web|chatwoot|chatwoot-sidekiq|chatwoot-db|chatwoot-redis|edge|tunnel-named"} >= 0)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Container {{ $labels.service }} is stopped'
          description: 'It exited with code {{ $value | printf "%.0f" }} and did not come back. Check its last logs in Grafana (Hazem · Logs).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#containerexited

      - alert: ContainerUnhealthy
        expr: count by (service) (docker_container_health_failing_streak{health_status="unhealthy", container_status="running"}) > 0
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: 'Docker reports container {{ $labels.service }} unhealthy'
          description: 'Its healthcheck fails. If it has a Prometheus check too (like ApiDown), that alert comes instead.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#containerunhealthy

      - alert: ContainerRestarting
        expr: max by (service) (increase(docker_container_status_restart_count{oneoff!="True"}[15m])) >= 2
        labels: { severity: warning }
        annotations:
          summary: 'Container {{ $labels.service }} keeps restarting'
          description: 'Docker restarted it {{ $value | printf "%.0f" }} times in 15 minutes. Check its logs in Grafana (Hazem · Logs).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#containerrestarting

      - alert: ContainerMemoryNearLimit
        expr: max by (service) (docker_container_mem_usage_percent{container_status="running"}) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Container {{ $labels.service }} is near its memory limit'
          description: 'Using {{ $value | printf "%.0f" }}% of its limit (mem_limit, or the whole server''s memory without one). At the limit, Linux kills it.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#containermemorynearlimit
