# The logs (Alloy). Alloy masks a full phone number and every key before Loki keeps a line, and counts the lines that had
# one: the same patterns as the nightly log-scan (infra/tools/bin/log-scan), on the same services. Docker still holds the line
# itself, so the night's scan will fail: the code that logged it is what has to change.
# Alloy makes a counter at its first line (with 1), and increase() needs two readings: the "unless … offset" half is that
# first line, a service whose counter did not exist 15 minutes ago.
groups:
  - name: logs
    rules:
      - alert: LogsHavePhoneNumber
        expr: |
          sum by (service) (increase(loki_process_custom_log_lines_with_phone_total[15m])) > 0
          or (sum by (service) (loki_process_custom_log_lines_with_phone_total)
              unless sum by (service) (loki_process_custom_log_lines_with_phone_total offset 15m))
        labels: { severity: warning }
        annotations:
          summary: 'The {{ $labels.service }} logs have a full phone number'
          description: '{{ $value | printf "%.0f" }} line(s) in 15 minutes. Masked before Loki, but Docker still keeps the line, so the nightly log scan will fail.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#logshavephonenumber

      - alert: LogsHaveSecret
        expr: |
          sum by (service) (increase(loki_process_custom_log_lines_with_secret_total[15m])) > 0
          or (sum by (service) (loki_process_custom_log_lines_with_secret_total)
              unless sum by (service) (loki_process_custom_log_lines_with_secret_total offset 15m))
        labels: { severity: critical }
        annotations:
          summary: 'The {{ $labels.service }} logs have a key or a token'
          description: '{{ $value | printf "%.0f" }} line(s) in 15 minutes. Masked before Loki, but Docker still keeps the line: treat the key as exposed and change it.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#logshavesecret

      - alert: LogShippingFailing
        expr: sum by (service) (increase(loki_write_dropped_entries_total{job="alloy"}[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: 'Logs are not reaching Loki'
          description: 'Alloy dropped {{ $value | printf "%.0f" }} line(s) in 15 minutes (Loki is down or refusing them).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#logshippingfailing
