# Both Postgres (cluster="office": postgres; cluster="chatwoot": chatwoot-db) and both Redis.
groups:
  - name: databases
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: '{{ if eq $labels.cluster "office" }}The office database{{ else }}The Chatwoot database{{ end }} is down'
          description: '{{ if eq $labels.cluster "office" }}Hazem, the panel and n8n all stop without it.{{ else }}Chatwoot (the conversations) stops without it.{{ end }}'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgresdown

      - alert: PostgresTooManyConnections
        expr: |
          sum by (cluster, service) (pg_stat_activity_count)
            / max by (cluster, service) (pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ if eq $labels.cluster "office" }}The office database{{ else }}The Chatwoot database{{ end }} is near its connection limit'
          description: 'Using {{ $value | humanizePercentage }} of max_connections. When it is full, new connections are refused.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgrestoomanyconnections

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: 'Deadlock in database {{ $labels.datname }}'
          description: '{{ $value | printf "%.0f" }} in 15 minutes. Postgres cancelled one of the two transactions, and the code retries.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgresdeadlocks

      - alert: PostgresLongTransaction
        expr: max by (cluster, service, datname) (pg_stat_activity_max_tx_duration{datname!=""}) > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'A transaction open for over 15 minutes ({{ $labels.datname }})'
          description: 'Open for {{ $value | humanizeDuration }}. It holds locks and blocks vacuum.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgreslongtransaction

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: '{{ if eq $labels.cluster "office" }}The office Redis{{ else }}The Chatwoot Redis{{ end }} is down'
          description: '{{ if eq $labels.cluster "office" }}n8n uses it to group messages and stop duplicates.{{ else }}Chatwoot and Sidekiq stop without it.{{ end }}'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#redisdown

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '{{ if eq $labels.cluster "office" }}The office Redis{{ else }}The Chatwoot Redis{{ end }} uses over 80% of its memory'
          description: 'Using {{ $value | humanizePercentage }} of maxmemory. When it is full it refuses writes (noeviction), and WhatsApp messages stop.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#redismemoryhigh

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: '{{ if eq $labels.cluster "office" }}The office Redis{{ else }}The Chatwoot Redis{{ end }} rejected connections'
          description: 'Rejected {{ $value | printf "%.0f" }} connection(s) in 15 minutes (maxclients).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#redisrejectedconnections
