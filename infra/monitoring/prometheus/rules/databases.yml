# Both Postgres (cluster="office": postgres; cluster="chatwoot": chatwoot-db) and both Redis.
groups:
  - name: databases
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: '{{ if eq $labels.cluster "office" }}داتابيز المكتب{{ else }}داتابيز Chatwoot{{ end }} مش بترد'
          description: '{{ if eq $labels.cluster "office" }}حازم والبانل وn8n كلهم واقفين من غيرها.{{ else }}Chatwoot (شاشة المحادثات) واقف من غيرها.{{ end }}'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgresdown

      - alert: PostgresTooManyConnections
        expr: |
          sum by (cluster, service) (pg_stat_activity_count)
            / max by (cluster, service) (pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ if eq $labels.cluster "office" }}داتابيز المكتب{{ else }}داتابيز Chatwoot{{ end }} قرّبت توصل لأقصى عدد اتصالات'
          description: 'مستخدم {{ $value | humanizePercentage }} من max_connections. لما يكمل، أي اتصال جديد هيترفض.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgrestoomanyconnections

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: 'فيه deadlock في داتابيز {{ $labels.datname }}'
          description: 'حصل {{ $value | printf "%.0f" }} مرة في ربع ساعة. Postgres بيلغي واحدة من العمليتين، والكود بيحاول تاني.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgresdeadlocks

      - alert: PostgresLongTransaction
        expr: max by (cluster, service, datname) (pg_stat_activity_max_tx_duration{datname!=""}) > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'فيه transaction مفتوحة بقالها أكتر من ربع ساعة ({{ $labels.datname }})'
          description: 'بقالها {{ $value | humanizeDuration }}. بتمسك locks وبتمنع التنضيف (vacuum).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#postgreslongtransaction

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Redis بتاع {{ if eq $labels.cluster "office" }}المكتب{{ else }}Chatwoot{{ end }} مش بيرد'
          description: '{{ if eq $labels.cluster "office" }}n8n بيستخدمه في تجميع الرسايل ومنع التكرار.{{ else }}Chatwoot وSidekiq واقفين من غيره.{{ end }}'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#redisdown

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Redis بتاع {{ if eq $labels.cluster "office" }}المكتب{{ else }}Chatwoot{{ end }} مستخدم أكتر من 80% من حده'
          description: 'مستخدم {{ $value | humanizePercentage }} من maxmemory. لما يتملي بيرفض أي كتابة (noeviction)، فرسايل واتساب تقف.'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#redismemoryhigh

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: 'Redis بتاع {{ if eq $labels.cluster "office" }}المكتب{{ else }}Chatwoot{{ end }} رفض اتصالات'
          description: 'رفض {{ $value | printf "%.0f" }} اتصال في ربع ساعة (maxclients).'
          runbook_url: https://github.com/LegalAI-Platform/Office_chatbot/blob/main/docs/runbooks/monitoring.md#redisrejectedconnections
