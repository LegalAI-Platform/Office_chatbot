# Grafana's dashboards (v1.107): the JSON files in infra/monitoring/grafana/dashboards, in the folder «حازم». They are read
# again every minute and cannot be saved from the UI: change the file (export the JSON from Grafana), commit, deploy.
apiVersion: 1

providers:
  - name: hazem
    orgId: 1
    folder: حازم
    folderUid: hazem
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
