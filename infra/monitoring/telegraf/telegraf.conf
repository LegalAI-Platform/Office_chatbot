# Telegraf (v1.107, docs/runbooks/monitoring.md): every container of this compose project — its CPU, memory, network, disk,
# its Docker healthcheck and its restarts — from Docker's own API, through docker-proxy (reads only), for Prometheus on
# telegraf:9273. It mounts nothing of this machine and has no Docker or containerd socket. (cAdvisor was the first choice;
# with Docker's containerd image store it needs containerd's socket, which is root on this machine.)
[agent]
  interval = "15s"
  round_interval = true
  collection_jitter = "0s"
  flush_interval = "15s"
  omit_hostname = true
  quiet = true
  skip_processors_after_aggregators = true # there are neither (and it is the new default)

[[inputs.docker]]
  endpoint = "tcp://docker-proxy:2375"
  timeout = "10s"
  gather_services = false
  source_tag = false
  # a stopped container too, so a service that stays down is seen (ContainerExited)
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  # one series per container, not per CPU or per disk
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = ["com.docker.compose.service", "com.docker.compose.project", "com.docker.compose.oneoff"]
  tag_env = []

  # this project's containers only
  [inputs.docker.tagpass]
    "com.docker.compose.project" = ["${COMPOSE_PROJECT_NAME}"]

[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  metric_version = 2
  # a container that is gone stops being reported a minute later
  expiration_interval = "60s"
  # the healthcheck's state ("healthy", "unhealthy") becomes a label
  string_as_label = true
  export_timestamp = false
