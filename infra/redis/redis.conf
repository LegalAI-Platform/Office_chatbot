# Redis for the test environment.
# Used later (TASK 03+) for message debounce, de-duplication, locks and rate limiting.
# The password is passed with --requirepass from .env (see docker-compose.yml).

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: locks and dedup keys must survive a restart.
appendonly yes
appendfsync everysec
dir /data

# Keys must never be evicted silently (locks / dedup), so fail writes instead.
maxmemory 256mb
maxmemory-policy noeviction

# Dangerous commands disabled.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""

loglevel notice
