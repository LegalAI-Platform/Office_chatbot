# The edge (TASK 13, DECISIONS v1.18): the only thing the Cloudflare tunnel reaches. It lets through Meta's
# WhatsApp webhook (the WhatsApp Trigger of META-WA-INBOUND: GET to verify, POST for the events) and nothing else:
# n8n's login page, its API, the internal send webhook and every other path answer 404 from the internet.
# No access log: Meta's verification request carries the verify token in its address.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log off;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 2m;   # Meta's events are JSON; media is fetched by n8n, never posted here

    # n8n's address is looked up again (Docker's DNS): a recreated n8n (tunnel-refresh) gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $n8n http://n8n:5678;

    location = /webhook/3c1f0b6e-6a52-4f0e-9a51-0e0c0a5ea001/webhook {
        limit_except GET POST { deny all; }
        proxy_pass $n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # As cloudflared sent it: n8n counts one proxy hop (N8N_PROXY_HOPS=1), as before the edge.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 404;
    }
}
