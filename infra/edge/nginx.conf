# The edge (TASK 13, DECISIONS v1.18): the only thing the Cloudflare tunnel reaches. It lets through Meta's
# WhatsApp webhook (the WhatsApp Trigger of META-WA-INBOUND: GET to verify, POST for the events) and nothing else:
# n8n's login page, its API, the internal send webhook and every other path answer 404 from the internet.
# TASK 14: with the office's domain on a Named Tunnel, more names: panel.<domain> is the panel and chat.<domain> is
# Chatwoot (Egypt only, a Cloudflare WAF rule), the domain itself the landing page. Any other name (wa.<domain>, a
# Quick Tunnel's) is the webhook only, as before.
# No access log: Meta's verification request carries the verify token in its address.
# A flood guard for the whole edge (security review 2026-10-26, finding 3). Every request comes from cloudflared,
# so the key is one for all: 20 a second, bursts of 200. Past it Meta gets 429 and sends the event again later.
# The per-client limit is in the database (whatsapp.turns_per_client_hour, migration 0020).
limit_req_zone $server_name zone=edge_flood:1m rate=20r/s;

server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log off;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 2m;   # Meta's events are JSON; media is fetched by n8n, never posted here

    # n8n's address is looked up again (Docker's DNS): a recreated n8n (tunnel-refresh) gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $n8n http://n8n:5678;

    location = /webhook/3c1f0b6e-6a52-4f0e-9a51-0e0c0a5ea001/webhook {
        limit_except GET POST { deny all; }
        limit_req zone=edge_flood burst=200 nodelay;
        limit_req_status 429;
        proxy_pass $n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # As cloudflared sent it: n8n counts one proxy hop (N8N_PROXY_HOPS=1), as before the edge.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 404;
    }
}

# The visitor's own address, as Cloudflare saw it (cloudflared adds it; nobody on the internet can set it).
map $http_cf_connecting_ip $visitor {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# Chatwoot's live updates (/cable) are a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# The panel: all of it (its own nginx serves the pages and lets through /api/panel only).
server {
    listen 8081;
    server_name ~^panel\.;
    server_tokens off;
    access_log off; # a search address holds part of a client's name or number

    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;
    client_max_body_size 20m; # the panel's own nginx keeps each path's limit (a delivered file: 20 MB)

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:8080;

    location / {
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $visitor;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}

# The domain itself (hazem-office.tech, www. too): the landing page, open to everyone (no client data, no form).
# «تسجيل الدخول» is /login, sent to panel.<domain>, so the page names no domain.
server {
    listen 8081;
    server_name ~^(www\.)?(?<apex>[a-z0-9-]+\.[a-z]+)$;
    server_tokens off;
    access_log off;

    client_max_body_size 1k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:8080;

    location = /login {
        return 302 https://panel.$apex/login;
    }

    location / {
        limit_except GET HEAD { deny all; }
        rewrite ^/(.*)$ /landing/$1 break;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $visitor;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Chatwoot, for the staff's conversations.
server {
    listen 8081;
    server_name ~^chat\.;
    server_tokens off;
    access_log off;

    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;
    client_max_body_size 40m; # an attachment the staff sends

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chatwoot http://chatwoot:3000;

    location / {
        proxy_pass $chatwoot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $visitor;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s; # an open /cable
    }
}
