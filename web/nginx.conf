# Hazem panel. Every response gets the security headers below: they are set once here, and no
# location adds its own header (an add_header in a location would drop these).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The panel's API only. n8n's endpoints (/api/hazem/*, X-Hazem-Token) are never reachable here.
    location /api/panel/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hazem-Token "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y; # file names carry a content hash
        try_files $uri =404;
    }

    location / {
        expires -1; # index.html: always the newest build
        try_files $uri /index.html;
    }
}
