# Hazem panel. Every response gets the security headers below: they are set once here, and no
# location adds its own header (an add_header in a location would drop these).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # A CSV of the office's lists (TASK 07c): up to 1 MB here, 64 KB everywhere else.
    location = /api/panel/lists/import {
        access_log off;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hazem-Token "";
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # The panel's API only. n8n's endpoints (/api/hazem/*, X-Hazem-Token) are never reachable here.
    # No access log: a search address holds part of a client's name or number.
    location /api/panel/ {
        access_log off;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hazem-Token "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    location /api/ {
        return 404;
    }

    # TASK 10 (v1.14): the file a lawyer delivers goes from the browser to storage here, on the panel's own
    # origin (no CORS), never through the API. Only a PUT under office-sensitive/deliverables/, only with the
    # upload link the API signed for that storage host (10 minutes), 20 MB at most.
    location ^~ /storage/office-sensitive/deliverables/ {
        access_log off;
        limit_except PUT { deny all; }
        resolver 127.0.0.11 valid=30s;
        set $storage http://garage:3900;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $storage;
        proxy_http_version 1.1;
        proxy_set_header Host garage:3900;
        proxy_set_header Cookie "";
        proxy_set_header X-Hazem-Token "";
        proxy_request_buffering off;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location /storage/ {
        return 404;
    }

    location /assets/ {
        expires 1y; # file names carry a content hash
        try_files $uri =404;
    }

    location / {
        expires -1; # index.html: always the newest build
        try_files $uri /index.html;
    }
}
