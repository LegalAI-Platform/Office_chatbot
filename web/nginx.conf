# Hazem panel. Every response gets the security headers in security-headers.inc: the server includes them,
# and a location that sets a header of its own includes them again (nginx would drop them otherwise).
# The API, with connections kept open between requests (no new TCP handshake for every call).
upstream api {
    server api:8080;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;

    include /etc/nginx/hazem-headers.inc;

    # Slow or oversized requests are cut early; a stuck client cannot hold a worker.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # Compressed answers: the build ships a .gz next to every file (gzip_static); the API's JSON is compressed
    # on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # A CSV of the office's lists (TASK 07c): up to 1 MB here, 64 KB everywhere else.
    location = /api/panel/lists/import {
        access_log off;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hazem-Token "";
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # The panel's API only. n8n's endpoints (/api/hazem/*, X-Hazem-Token) are never reachable here.
    # No access log: a search address holds part of a client's name or number.
    location /api/panel/ {
        access_log off;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hazem-Token "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    location /api/ {
        return 404;
    }

    # TASK 10 (v1.14): the file a lawyer delivers goes from the browser to storage here, on the panel's own
    # origin (no CORS), never through the API. Only a PUT under office-sensitive/deliverables/, only with the
    # upload link the API signed for that storage host (10 minutes), 20 MB at most.
    location ^~ /storage/office-sensitive/deliverables/ {
        access_log off;
        limit_except PUT { deny all; }
        resolver 127.0.0.11 valid=30s;
        set $storage http://garage:3900;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $storage;
        proxy_http_version 1.1;
        proxy_set_header Host garage:3900;
        proxy_set_header Cookie "";
        proxy_set_header X-Hazem-Token "";
        proxy_request_buffering off;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location /storage/ {
        return 404;
    }

    # File names carry a content hash: kept for a year and never checked again.
    location /assets/ {
        include /etc/nginx/hazem-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html: always the newest build.
    location / {
        include /etc/nginx/hazem-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
