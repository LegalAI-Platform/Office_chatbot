# Office WhatsApp System (Hazem) - Test/Staging stack (TASK 01)
# Decisions: docs/decisions/DECISIONS-v1.11.md
#
# Core services start with `docker compose up -d`: postgres, redis, garage, n8n, the
# .NET backend (api), the panel (web, TASK 07a; Appsmith was removed) and Chatwoot for the
# staff's conversations (TASK 07b, T-24: chatwoot, chatwoot-sidekiq, its own database and redis).
# Optional profiles: tests (meta-stub for hazem-e2e), tunnel (Cloudflare Quick Tunnel),
#                    tunnel-named (Cloudflare Named Tunnel), tools (one-off commands),
#                    monitoring (v1.107: Prometheus, Alertmanager, Loki, Alloy, Grafana; scripts/linux/monitoring.sh).
# Every port is bound to 127.0.0.1 only. n8n is the only service ever exposed
# to the internet, and only through the tunnel profile. The api has no host port at all;
# the panel reaches it through the web container (/api/panel only).

name: ${COMPOSE_PROJECT_NAME:-office}

# Chatwoot Community Edition (T-24), pinned. It talks to the api only (an API inbox), never to
# WhatsApp or Meta. Its database holds a second copy of client messages: backup and security
# treat it like ours (TASK 13).
# Every long-running service's log: at most 5 files of 10 MB, the oldest dropped (security review 2026-10-26,
# finding 7). Before, Docker kept every line forever on this disk, outside the backups' 30 days.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.19.1-ce
  environment: &chatwoot-env
    TZ: Africa/Cairo
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: "true"
    # warn, not info: at info Rails logs every request's parameters, which can carry the staff's replies.
    LOG_LEVEL: warn
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
    FRONTEND_URL: ${CHATWOOT_URL:-http://127.0.0.1:3000}
    DEFAULT_LOCALE: ar
    FORCE_SSL: "false"
    ENABLE_ACCOUNT_SIGNUP: "false"
    DISABLE_TELEMETRY: "true"
    ENABLE_PUSH_RELAY_SERVER: "false"
    POSTGRES_HOST: chatwoot-db
    POSTGRES_USERNAME: chatwoot
    POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://chatwoot-redis:6379
    REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD}
    ACTIVE_STORAGE_SERVICE: local
    # Its webhook calls http://api:8080, which Chatwoot's SSRF guard refuses by default. Chatwoot
    # sits on chatwoot_net, where the api is the only other service; only «حازم (النظام)» is an
    # administrator (can set webhooks); never on the internet before TASK 14 (review this then).
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    # Its own mails (invitations, password resets) from the same no-reply sender as the panel.
    MAILER_SENDER_EMAIL: ${SMTP_FROM_NAME:-Office} <${SMTP_FROM:-no-reply@localhost}>
    SMTP_ADDRESS: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_AUTHENTICATION: login
    SMTP_ENABLE_STARTTLS_AUTO: "true"
    SMTP_OPENSSL_VERIFY_MODE: peer
  volumes:
    - chatwoot_storage:/app/storage
  networks: [chatwoot_net]

# The three images of this repo: built here by default (`:local`); on the server .env names the ones the CI
# published (ghcr.io/legalai-platform/office-*:sha-…) and OFFICE_PULL_POLICY=missing, so nothing is built there.
x-tools: &tools
  build:
    context: ./infra/tools
  image: ${OFFICE_TOOLS_IMAGE:-office-tools:local}
  pull_policy: ${OFFICE_PULL_POLICY:-build}
  env_file:
    - path: .env
      required: true
  environment:
    TZ: Africa/Cairo
  networks: [office_net, chatwoot_net]
  restart: "no"

# v1.107 (the monitoring, docs/runbooks/monitoring.md): profile "monitoring", never started by `up`. Nothing of it is on the
# internet: none joins tunnel_net, and its only host ports (Grafana, Prometheus, Alertmanager) are on 127.0.0.1, reached through
# an SSH tunnel. Locked down like the api: read-only, no Linux capabilities, a ceiling on memory and processes.
x-monitoring: &monitoring
  profiles: ["monitoring"]
  restart: unless-stopped
  logging: *logging
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Refuses to let the stack start while .env still has CHANGE_ME values,
  # missing secrets, or a non-test ENVIRONMENT.
  preflight:
    <<: *tools
    command: ["preflight"]

  postgres:
    image: postgres:16.15
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      preflight:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - timezone=Africa/Cairo
      - -c
      - log_timezone=Africa/Cairo
    environment:
      TZ: Africa/Cairo
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Consumed only by infra/postgres/init/01-create-databases-and-roles.sh
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      OFFICE_MIGRATOR_PASSWORD: ${OFFICE_MIGRATOR_PASSWORD}
      OFFICE_APP_PASSWORD: ${OFFICE_APP_PASSWORD}
      OFFICE_READONLY_PASSWORD: ${OFFICE_READONLY_PASSWORD}
      OFFICE_API_PASSWORD: ${OFFICE_API_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP: during first-time init Postgres runs a socket-only temporary server,
      # which a socket check would report as ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [office_net]

  redis:
    image: redis:7.4.11
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      preflight:
        condition: service_completed_successfully
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: Africa/Cairo
      # Lets redis-cli inside the container authenticate without -a on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [office_net]

  # S3-compatible object storage for the test environment.
  # Replaces MinIO (T-06): MinIO no longer publishes container images.
  # Production stays on Cloudflare R2.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      TZ: Africa/Cairo
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"   # S3 API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [office_net]

  # One-shot: cluster layout, buckets, access keys, policies, lifecycle. Idempotent.
  storage-init:
    <<: *tools
    command: ["storage-init"]
    depends_on:
      garage:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.44.7
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      TZ: Africa/Cairo
      GENERIC_TIMEZONE: Africa/Cairo
      # Database: PostgreSQL only, never SQLite.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # v1.107: Prometheus reads /metrics on n8n's own port (inside office_net; the edge lets the webhook through only).
      # Node.js and the workflows' counts, no workflow id, no path, no credential.
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
      N8N_METRICS_INCLUDE_API_ENDPOINTS: "false"
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "false"
      # If this key changes or is lost, every credential stored in n8n becomes unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      # n8n 2.x name (WEBHOOK_URL is deprecated); .env keeps the variable WEBHOOK_URL.
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      # Privacy / telemetry
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Secrets live in n8n Credentials only; Code nodes cannot read env vars.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Execution data pruning (hours)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE}
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow JSON, templates and import/export scripts (read-only).
      - ./n8n:/opt/office/n8n:ro
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      # /healthz/readiness answers 503 until the database is connected and n8n's own
      # migrations are committed (/healthz alone says "ok" too early on a fresh install).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [office_net]

  # .NET backend: the brain (DECISIONS v1.3). n8n calls it at http://api:8080 and it calls
  # n8n back at the internal send webhook. Inside office_net only: no host port, no tunnel.
  # Database role office_api: schema "hazem" only (migration 0003).
  api:
    build:
      context: ./backend
    image: ${OFFICE_API_IMAGE:-office-api:local}
    pull_policy: ${OFFICE_PULL_POLICY:-build}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Africa/Cairo
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      ConnectionStrings__Office: Host=postgres;Port=5432;Database=office;Username=office_api;Password=${OFFICE_API_PASSWORD}
      Hazem__ApiToken: ${HAZEM_API_TOKEN}
      Hazem__N8nInternalSendUrl: http://n8n:5678/webhook/hazem-internal-send
      Hazem__N8nInternalSendToken: ${N8N_INTERNAL_SEND_TOKEN}
      # TASK 04 (T-07/T-08): intent classification. An empty key = classification off.
      Hazem__OpenAiApiKey: ${HAZEM_OPENAI_API_KEY:-}
      Hazem__OpenAiModel: ${OPENAI_MODEL:-gpt-4.1-mini}
      Hazem__OpenAiBaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      Hazem__AnthropicApiKey: ${HAZEM_ANTHROPIC_API_KEY:-}
      Hazem__AnthropicModel: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # v1.9 (T-23): sign-up, e-mail codes and the authenticator. Without PANEL_SECRET_KEY and
      # SMTP_HOST/SMTP_FROM the sign-up page says it is not available; sign-in still works.
      Panel__SecretKey: ${PANEL_SECRET_KEY:-}
      # v1.16: the authenticator is optional for everyone; true makes it a must for a manager again (v1.9).
      Panel__ManagersNeedTwoFactor: ${PANEL_MANAGERS_NEED_2FA:-false}
      # The keys behind the panel's cookies, on a volume so a rebuild does not sign everyone out.
      Panel__KeysPath: /app/keys
      Mail__Host: ${SMTP_HOST:-}
      Mail__Port: ${SMTP_PORT:-587}
      Mail__Ssl: ${SMTP_SSL:-true}
      Mail__Username: ${SMTP_USERNAME:-}
      Mail__Password: ${SMTP_PASSWORD:-}
      Mail__From: ${SMTP_FROM:-}
      Mail__FromName: ${SMTP_FROM_NAME:-}
      # TASK 07c: client files for the panel, read-only (its own key; nothing on backups).
      S3__Endpoint: http://garage:3900
      S3__Region: ${S3_REGION}
      S3__AccessKeyId: ${S3_API_ACCESS_KEY_ID}
      S3__SecretAccessKey: ${S3_API_SECRET_ACCESS_KEY}
      Panel__PublicUrl: ${PANEL_URL:-http://127.0.0.1:8080}
      # TASK 07b (T-24): Chatwoot on office_net. Empty tokens = the link is off.
      Chatwoot__BaseUrl: http://chatwoot:3000
      Chatwoot__PublicUrl: ${CHATWOOT_URL:-http://127.0.0.1:3000}
      Chatwoot__BotToken: ${CHATWOOT_BOT_TOKEN:-}
      Chatwoot__PlatformToken: ${CHATWOOT_PLATFORM_TOKEN:-}
      Chatwoot__WebhookSecret: ${CHATWOOT_WEBHOOK_TOKEN:-}
      # TASK 08 (T-14, P2): the lawyer's Google Calendar through a service account. Empty = no times offered.
      Hazem__GoogleServiceAccountJson: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
    healthcheck:
      # Process only; /health/ready (database and migration 0003) is checked by the healthcheck job.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - api_keys:/app/keys
    # Locked down: no Linux capabilities, a read-only file system (only /tmp and the keys volume are
    # writable), and a ceiling on memory and processes.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256
    networks: [office_net, chatwoot_net]

  # TASK 02b (DECISIONS v1.19, T-03): WAHA, a second WhatsApp channel FOR TESTING ONLY, on a spare number, until Meta
  # approves the account (profile "waha", never started by `up`). It is not an official API: WhatsApp can ban the number
  # it runs, so never the office's number. n8n talks to it only while whatsapp.provider = waha (the rules stay Meta's:
  # test recipients, 24 hours, templates). Its dashboard (the QR code) is on 127.0.0.1:3010 only; the session and its
  # webhook to n8n are set by `tools waha-session`. docs/runbooks/waha.md.
  waha:
    image: devlikeapro/waha:noweb-2026.9.2
    profiles: ["waha"]
    restart: unless-stopped
    logging: *logging
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: office
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_ENABLED: "false"
      # The address in media.url of its webhooks (n8n keeps only the path and adds waha.base_url).
      WAHA_BASE_URL: http://waha:3000
      # A received file stays 10 minutes on WAHA: n8n fetches it within seconds.
      WHATSAPP_FILES_LIFETIME: "600"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      TZ: Africa/Cairo
    volumes:
      - waha_sessions:/app/.sessions
    ports:
      - "127.0.0.1:3010:3000"
    mem_limit: 768m
    pids_limit: 512
    networks: [office_net]

  # TEST ONLY (profile "tests", never started by `up`): stands in for Meta's Graph API media
  # endpoints and OpenAI transcription. hazem-e2e starts it, points whatsapp.graph_base_url and
  # ai.openai_base_url at it, and stops it again. It never stores Authorization values.
  meta-stub:
    build:
      context: ./backend
      dockerfile: tests/Office.TestStub/Dockerfile
    image: office-meta-stub:local
    pull_policy: build
    profiles: ["tests"]
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [office_net]

  # The panel (TASK 07a, DECISIONS v1.8 T-11): React served by unprivileged nginx, which also
  # forwards /api/panel (and nothing else under /api) to the api. Port 8080 on this machine only.
  web:
    build:
      context: ./web
    image: ${OFFICE_WEB_IMAGE:-office-web:local}
    pull_policy: ${OFFICE_PULL_POLICY:-build}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # Locked down like the api: unprivileged nginx needs only /tmp (its pid and buffers).
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 64
    networks: [office_net]

  # ---------- Chatwoot (TASK 07b, T-24) ----------
  chatwoot-db:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      TZ: Africa/Cairo
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      POSTGRES_DB: chatwoot
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - chatwoot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [chatwoot_net]

  chatwoot-redis:
    image: redis:7.4.11
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      preflight:
        condition: service_completed_successfully
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${CHATWOOT_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${CHATWOOT_REDIS_PASSWORD}
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chatwoot_net]

  # Creates or migrates Chatwoot's database, then exits (idempotent; runs on every `up`).
  chatwoot-init:
    <<: *chatwoot
    restart: "no"
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy

  chatwoot:
    <<: *chatwoot
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    depends_on:
      chatwoot-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api | grep -q version"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  chatwoot-sidekiq:
    <<: *chatwoot
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-init:
        condition: service_completed_successfully

  # TASK 13 (v1.18): the edge. The tunnels reach this nginx, never n8n itself: it lets through Meta's WhatsApp
  # webhook only (infra/edge/nginx.conf); n8n's login page and API answer 404 from the internet.
  edge:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
    profiles: ["tunnel", "tunnel-named"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./infra/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 32
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [office_net, chatwoot_net, tunnel_net] # TASK 14: chatwoot_net for chat.<domain>

  # Cloudflare Quick Tunnel: no account needed, random https://*.trycloudflare.com
  # URL that changes on every start. Forwards to the edge only (Meta's webhook).
  tunnel:
    image: cloudflare/cloudflared:2026.10.4
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      edge:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://edge:8081"]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [tunnel_net]   # TASK 13: the edge only; never n8n, the API or the databases

  # Cloudflare Named Tunnel: stable hostname. Configure the public hostname
  # -> http://edge:8081 in the Cloudflare dashboard (TASK 13: never n8n:5678) and set CLOUDFLARE_TUNNEL_TOKEN.
  tunnel-named:
    image: cloudflare/cloudflared:2026.10.4
    profiles: ["tunnel-named"]
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"] # no process inside can gain privileges (setuid binaries)
    depends_on:
      edge:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [tunnel_net]   # TASK 13: the edge only; never n8n, the API or the databases

  # One-off commands: healthcheck, backup, restore, gen-secrets.
  #   docker compose run --rm tools <command>
  tools:
    <<: *tools
    profiles: ["tools"]
    volumes:
      - ./n8n/fixtures:/fixtures:ro
      # wa-db-tests replays them on a throwaway database (TASK 03).
      - ./database/migrations:/migrations:ro

  # SQL migrations for the office database (connects as office_migrator only).
  #   docker compose run --rm migrate up|down|status
  migrate:
    image: amacneil/dbmate:2.36.0
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://office_migrator:${OFFICE_MIGRATOR_PASSWORD}@postgres:5432/office?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./database/migrations:/db/migrations:ro
    networks: [office_net]

  # ---------- The monitoring (v1.107, docs/runbooks/monitoring.md): profile "monitoring" ----------
  # One-shot, on every `monitoring.sh up`: checks the monitoring's settings in .env (the alert e-mails, Grafana's password) and
  # makes the exporters' database roles, office_monitor and chatwoot_monitor (pg_monitor only, never a superuser). Their
  # passwords are made here once, at random, into the monitoring_secrets volume: never in .env, never printed. Idempotent.
  monitoring-init:
    <<: *tools
    profiles: ["monitoring"]
    command: ["monitoring-init"]
    depends_on:
      postgres:
        condition: service_healthy
      chatwoot-db:
        condition: service_healthy
    volumes:
      - monitoring_secrets:/secrets

  # Every 15 seconds: the server, the containers, the API, n8n, both databases, both Redis, and the HTTP checks. It keeps
  # PROMETHEUS_RETENTION (30 days) within PROMETHEUS_RETENTION_SIZE. No admin API, no remote write: it only reads.
  # On office_net to read the api (9464) and n8n; Alertmanager, Loki and Grafana stay off office_net, where n8n is.
  prometheus:
    <<: *monitoring
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.listen-address=:9090
      - --web.external-url=http://127.0.0.1:9090/
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    pids_limit: 256
    networks: [monitoring_net, office_net]

  # The alerts' e-mails, through the panel's own SMTP (SMTP_* in .env: Resend), to ALERT_EMAIL_TO, and again when one is
  # resolved. start.sh fills the address and the server into its config at start; the key goes to a file on /tmp (memory)
  # and is never written into the config. monitoring_out is its way out to the mail server.
  alertmanager:
    <<: *monitoring
    image: prom/alertmanager:v0.34.2
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]
    environment:
      TZ: Africa/Cairo # the times in its e-mails
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 128m
    pids_limit: 64
    networks: [monitoring_net, monitoring_out]

  # The logs of every container, 7 days, then deleted (infra/monitoring/loki/loki.yml). No password of its own: only the
  # monitoring's own network reaches it.
  loki:
    <<: *monitoring
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    tmpfs: [/tmp]
    mem_limit: 768m
    pids_limit: 256
    networks: [monitoring_net]

  # Reads every container's log through docker-proxy and masks phone numbers, passwords, tokens and keys before Loki keeps
  # anything (infra/monitoring/alloy/mask.alloy). It also counts the lines that had one, so a leak is an alert within minutes.
  alloy:
    <<: *monitoring
    image: grafana/alloy:v1.21.3
    user: "473:473" # the image's own alloy user, not root: Docker comes through docker-proxy, no socket to own
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-office}
    depends_on: [loki, docker-proxy]
    volumes:
      - ./infra/monitoring/alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
    tmpfs: [/tmp]
    mem_limit: 384m
    pids_limit: 256
    networks: [monitoring_net, docker_proxy_net]

  # Docker's socket is root on this machine, so nothing of the monitoring gets it: this proxy answers reads of the containers
  # (their list, details, stats and logs) and Docker's info, and refuses everything else (every POST: start, stop, exec, …).
  # Its only clients are Alloy (the logs) and Telegraf (the numbers), on docker_proxy_net alone.
  docker-proxy:
    <<: *monitoring
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: "1" # GET /containers/…: the list, details, stats and logs
      INFO: "1" # GET /info (Telegraf)
      NETWORKS: "1" # GET /networks: Alloy's discovery reads the networks' names with the containers
      POST: "0" # nothing that changes anything
      LOG_LEVEL: warning # not a line for each of Telegraf's and Alloy's reads
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: [/run, /tmp]
    mem_limit: 64m
    pids_limit: 64
    networks: [docker_proxy_net]

  # The server itself: CPU, memory, disk, load, the clock. Reads the host's / read-only.
  node-exporter:
    <<: *monitoring
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|boot|snap|var/lib/docker/.+|var/lib/containerd/.+|var/snap/.+)($$|/)
      - --no-collector.wifi
      - --no-collector.infiniband
      - --no-collector.nfs
      - --no-collector.nfsd
      - --web.listen-address=:9100
    # rslave: Docker refuses a mount of / that would pin other containers' mounts (and Docker Desktop has no rslave at all:
    # monitoring.ps1 starts the monitoring without node-exporter there).
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
    mem_limit: 64m
    pids_limit: 64
    networks: [monitoring_net]

  # Every container's CPU, memory, network, disk, healthcheck and restarts, by its compose service, from Docker's own API
  # through docker-proxy: no mount of this machine, no socket (infra/monitoring/telegraf/telegraf.conf). Runs as its own user.
  telegraf:
    <<: *monitoring
    image: telegraf:1.40.2-alpine
    user: "100:101"
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-office}
    depends_on: [docker-proxy]
    volumes:
      - ./infra/monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    tmpfs: [/tmp]
    mem_limit: 128m
    pids_limit: 64
    networks: [monitoring_net, docker_proxy_net]

  # The office's Postgres, as office_monitor (pg_monitor only; its password from monitoring-init's volume).
  postgres-exporter:
    <<: *monitoring
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command: ["--collector.long_running_transactions"]
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: office_monitor
      DATA_SOURCE_PASS_FILE: /secrets/office_monitor
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    volumes:
      - monitoring_secrets:/secrets:ro
    mem_limit: 64m
    pids_limit: 64
    networks: [monitoring_net, office_net]

  # Chatwoot's Postgres, as chatwoot_monitor (pg_monitor only).
  chatwoot-db-exporter:
    <<: *monitoring
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command: ["--collector.long_running_transactions"]
    environment:
      DATA_SOURCE_URI: chatwoot-db:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: chatwoot_monitor
      DATA_SOURCE_PASS_FILE: /secrets/chatwoot_monitor
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    volumes:
      - monitoring_secrets:/secrets:ro
    mem_limit: 64m
    pids_limit: 64
    networks: [monitoring_net, chatwoot_net]

  # The office's Redis. CONFIG is renamed away there (infra/redis/redis.conf), so the exporter does not ask for it.
  redis-exporter:
    <<: *monitoring
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_EXPORTER_CONFIG_COMMAND: "-"
      REDIS_EXPORTER_INCL_SYSTEM_METRICS: "false"
    mem_limit: 48m
    pids_limit: 64
    networks: [monitoring_net, office_net]

  # Chatwoot's Redis, and Sidekiq's queues in it: their sizes, the retries, the dead jobs and the running Sidekiq processes.
  chatwoot-redis-exporter:
    <<: *monitoring
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: redis://chatwoot-redis:6379
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD}
      REDIS_EXPORTER_INCL_SYSTEM_METRICS: "false"
      REDIS_EXPORTER_CHECK_KEYS: "queue:*"
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: "processes,retry,dead,schedule,stat:processed,stat:failed"
    mem_limit: 48m
    pids_limit: 64
    networks: [monitoring_net, chatwoot_net]

  # The HTTP checks: each service's own health page from inside, and the domain's webhook and landing page from outside
  # (Cloudflare, the tunnel and the edge), as Meta and a visitor reach them (infra/monitoring/blackbox/blackbox.yml).
  blackbox:
    <<: *monitoring
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./infra/monitoring/blackbox:/etc/blackbox:ro
    mem_limit: 64m
    pids_limit: 64
    networks: [monitoring_net, office_net, chatwoot_net]

  # The dashboards (infra/monitoring/grafana), on 127.0.0.1:3300 only (an SSH tunnel). Its own sign-in: GRAFANA_ADMIN_USER and
  # GRAFANA_ADMIN_PASSWORD (monitoring-init refuses to start it without a strong one). No sign-up, no anonymous access, nothing
  # sent to grafana.com (no usage report, no update or news check, no plugin installed from the internet).
  grafana:
    <<: *monitoring
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-3300}/
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Africa/Cairo
      GF_USERS_DEFAULT_LANGUAGE: en-US # v1.109: the dashboards are English, so is Grafana itself
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GF_LOG_LEVEL: warn
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m # Grafana 13 and its data-source plugins (separate processes) take ~320 MB
    pids_limit: 512
    networks: [monitoring_net, monitoring_out]

networks:
  office_net:
    name: office_net
  # TASK 07b: Chatwoot, its database and redis, and the api (Chatwoot's only way to the rest).
  chatwoot_net:
    name: chatwoot_net
  # TASK 13: the tunnels and the edge only. Whatever the Cloudflare dashboard says, cloudflared reaches nothing else.
  tunnel_net:
    name: tunnel_net
  # v1.107: the monitoring's own network, with no way out to the internet.
  monitoring_net:
    name: monitoring_net
    internal: true
  # v1.107: Alertmanager's way out to the mail server, and Grafana's to its 127.0.0.1 port.
  monitoring_out:
    name: monitoring_out
  # v1.107: docker-proxy with Alloy and cAdvisor only, no way out.
  docker_proxy_net:
    name: docker_proxy_net
    internal: true

volumes:
  api_keys:
  waha_sessions:   # TASK 02b: the WhatsApp session of the spare number (delete it to forget the number)
  chatwoot_db_data:
  chatwoot_redis_data:
  chatwoot_storage:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  n8n_data:
  # v1.107: the monitoring's data (none of it is in the backups: it is not the office's data)
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  grafana_data:
  monitoring_secrets: # the exporters' database passwords (monitoring-init); delete it to make new ones
