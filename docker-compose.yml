# Office WhatsApp System (Hazem) - Test/Staging stack
# Decisions: docs/decisions/DECISIONS-v1.1.md
#
# Core services start with `docker compose up -d`.
# Optional profiles: tunnel (Cloudflare Quick Tunnel), tunnel-named (Named Tunnel),
#                    tools (one-off commands: tools, cli).
# Every port is bound to 127.0.0.1 only. The API is the only service ever exposed
# to the internet, and only through a tunnel profile.

name: ${COMPOSE_PROJECT_NAME:-office}

x-tools: &tools
  build:
    context: ./infra/tools
  image: office-tools:local
  pull_policy: build
  env_file:
    - path: .env
      required: true
  environment:
    TZ: Africa/Cairo
  networks: [office_net]
  restart: "no"

x-backend: &backend
  build:
    context: ./backend
  image: office-backend:local
  networks: [office_net]

x-whatsapp-env: &whatsapp-env
  WhatsApp__Enabled: ${WhatsApp__Enabled:-false}
  WhatsApp__AppId: ${WhatsApp__AppId:-}
  WhatsApp__WabaId: ${WhatsApp__WabaId:-}
  WhatsApp__PhoneNumberId: ${WhatsApp__PhoneNumberId:-}
  WhatsApp__GraphApiVersion: ${WhatsApp__GraphApiVersion:-v26.0}
  WhatsApp__AppSecret: ${WhatsApp__AppSecret:-}
  WhatsApp__AccessToken: ${WhatsApp__AccessToken:-}
  WhatsApp__VerifyToken: ${WhatsApp__VerifyToken:-}
  WhatsApp__TestRecipients: ${WhatsApp__TestRecipients:-}
  WhatsApp__EchoTest__Enabled: ${WhatsApp__EchoTest__Enabled:-false}
  Telegram__BotToken: ${Telegram__BotToken:-}
  Telegram__ChatId: ${Telegram__ChatId:-}

services:
  # Refuses to let the stack start while .env still has CHANGE_ME values,
  # missing secrets, or a non-test ENVIRONMENT.
  preflight:
    <<: *tools
    command: ["preflight"]

  postgres:
    image: postgres:16.15
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - timezone=Africa/Cairo
      - -c
      - log_timezone=Africa/Cairo
    environment:
      TZ: Africa/Cairo
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Consumed only by infra/postgres/init/01-create-databases-and-roles.sh
      OFFICE_MIGRATOR_PASSWORD: ${OFFICE_MIGRATOR_PASSWORD}
      OFFICE_APP_PASSWORD: ${OFFICE_APP_PASSWORD}
      OFFICE_READONLY_PASSWORD: ${OFFICE_READONLY_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP: during first-time init Postgres runs a socket-only temporary server,
      # which a socket check would report as ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [office_net]

  redis:
    image: redis:7.4.11
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: Africa/Cairo
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [office_net]

  # S3-compatible object storage for the test environment (MinIO publishes no
  # images anymore). Production uses Cloudflare R2.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      TZ: Africa/Cairo
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [office_net]

  storage-init:
    <<: *tools
    command: ["storage-init"]
    depends_on:
      garage:
        condition: service_healthy

  # One-shot: EF Core migrations + Hangfire schema as office_migrator (T-19).
  # Runs on every `up`; a no-op when the database is current. The API waits for it.
  migrator:
    <<: *backend
    restart: "no"
    entrypoint: ["dotnet", "/app/cli/Office.Cli.dll", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Africa/Cairo
      DOTNET_ENVIRONMENT: ${ENVIRONMENT}
      ConnectionStrings__Office: Host=postgres;Port=5432;Database=office;Username=office_app;Password=${OFFICE_APP_PASSWORD}
      ConnectionStrings__OfficeMigrator: Host=postgres;Port=5432;Database=office;Username=office_migrator;Password=${OFFICE_MIGRATOR_PASSWORD}

  # ASP.NET Core backend (T-03). Runs as office_app (no DDL); never migrates itself.
  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *whatsapp-env
      TZ: Africa/Cairo
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
      ConnectionStrings__Office: Host=postgres;Port=5432;Database=office;Username=office_app;Password=${OFFICE_APP_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Operational commands (Office.Cli):  docker compose run --rm cli <command>
  cli:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["dotnet", "/app/cli/Office.Cli.dll"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *whatsapp-env
      TZ: Africa/Cairo
      DOTNET_ENVIRONMENT: ${ENVIRONMENT}
      ConnectionStrings__Office: Host=postgres;Port=5432;Database=office;Username=office_app;Password=${OFFICE_APP_PASSWORD}
      ConnectionStrings__OfficeMigrator: Host=postgres;Port=5432;Database=office;Username=office_migrator;Password=${OFFICE_MIGRATOR_PASSWORD}

  # Cloudflare Quick Tunnel: random https://*.trycloudflare.com URL that changes on
  # every start. Forwards to the API only. Use scripts/*/tunnel-refresh.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://api:8080"]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [office_net]

  # Cloudflare Named Tunnel (stable hostname, needs a domain). Public hostname
  # -> http://api:8080 is configured in the Cloudflare dashboard.
  tunnel-named:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel-named"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [office_net]

  # One-off commands: healthcheck, backup, restore, gen-secrets.
  #   docker compose run --rm tools <command>
  tools:
    <<: *tools
    profiles: ["tools"]

networks:
  office_net:
    name: office_net

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
