# CI: every pull request, and every push to main (through images.yml, before the images are published).
# Runs on GitHub's machines only: the repository is public, so never on a self-hosted runner or the server.
# Actions are pinned to a commit (the tag in the comment), so a moved tag cannot change what runs here.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_SUPERUSER: office_super
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Throwaway database passwords
        run: |
          for v in POSTGRES_SUPERUSER_PASSWORD N8N_DB_PASSWORD OFFICE_MIGRATOR_PASSWORD OFFICE_APP_PASSWORD OFFICE_READONLY_PASSWORD OFFICE_API_PASSWORD; do
            p="$(openssl rand -hex 24)"
            echo "::add-mask::$p"
            echo "$v=$p" >> "$GITHUB_ENV"
          done

      # The same image, settings and init scripts as docker-compose.yml: the tests make their own office_test_*
      # database on it, apply database/migrations as office_migrator and run the API as office_api.
      - name: Postgres
        run: |
          docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e TZ=Africa/Cairo -e POSTGRES_USER="$POSTGRES_SUPERUSER" -e POSTGRES_PASSWORD="$POSTGRES_SUPERUSER_PASSWORD" \
            -e POSTGRES_DB=postgres -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -e N8N_DB_PASSWORD -e OFFICE_MIGRATOR_PASSWORD -e OFFICE_APP_PASSWORD -e OFFICE_READONLY_PASSWORD -e OFFICE_API_PASSWORD \
            -v "$PWD/infra/postgres/init:/docker-entrypoint-initdb.d:ro" \
            postgres:16.15 postgres -c timezone=Africa/Cairo -c log_timezone=Africa/Cairo
          # over TCP: during the first init Postgres runs a socket-only server that a socket check calls ready too early
          for _ in $(seq 60); do
            docker exec pg pg_isready -q -h 127.0.0.1 -U "$POSTGRES_SUPERUSER" -d postgres && exit 0
            sleep 2
          done
          docker logs pg
          exit 1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/.nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Unit and integration tests
        working-directory: backend
        env:
          OFFICE_TEST_PG_HOST: 127.0.0.1
        run: dotnet test --solution Office.sln

  web:
    name: Panel tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0 # web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        env:
          npm_config_fund: "false"
          npm_config_audit: "false"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the whole history: a key removed in a later commit is still public in an earlier one
          persist-credentials: false
      # Keys, tokens and full Egyptian mobile numbers (.gitleaks.toml); the known safe ones are in .gitleaksignore.
      # --redact: a finding is shown without its value, so the log of this public repo never repeats it.
      - name: Gitleaks
        run: |
          # as the runner's own user: git refuses a checkout owned by someone else
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --no-banner --redact -v --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore

  images:
    name: Image build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: web
          - image: tools
            context: infra/tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Built only, never pushed: the Dockerfiles still build. images.yml publishes them from main.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
